<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Profile Card Webpage</title>

<style>

  body {
    font-family: Arial, sans-serif;
    background: #eef1f5;
    margin: 0;
    padding: 40px 0;
  }

  /* ----------------- PROFILE CARD ----------------- */

  .card {
    width: 350px;
    padding: 25px;
    margin: auto;
    text-align: center;

    background: linear-gradient(135deg, #b195c9, #6911db, #bb3b66);
    border-radius: 18px;

    border: 3px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    color: hsl(0, 0%, 98%);
  }

  .card img {
    width: 120px;
    border-radius: 50%;
    margin-bottom: 15px;
    border: 3px solid rgba(255,255,255,0.6);
  }

  .card h2 {
    font-size: 26px;
    margin: 10px 0;
  }

  .card p {
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 25px;
  }

  /* ----------------- BUTTON ----------------- */

  .btn {
    padding: 12px 30px;
    font-size: 16px;

    background: radial-gradient(circle, #ffffff, #ffe3f6);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #333;

    box-shadow: 0 5px 12px rgba(0,0,0,0.2);
    transition: 0.3s;
  }

  .btn:hover {
    transform: scale(1.07);
  }

</style>
</head>

<body>

<!-- ========== MINI PROFILE CARD ========== -->

<div class="card">
    <img src="fed7e3b3-54f1-4cb5-bdea-91ae178a6f8e.png
" alt="">

    <h2>Your Name</h2>

    <p>
      Web Developer | Designer  
      Passionate about creating beautiful UI and powerful web experiences.
    </p>

    <button class="btn">Contact Me</button>
</div>

</body>
</html>
